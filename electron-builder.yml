appId: app.holst.desktop
productName: Холст
executableName: holst
directories:
  output: release
files:
  - out
  - package.json
win:
  icon: resources/icon.ico
  target:
    - nsis
mac:
  icon: resources/icon-1024.png
  category: public.app-category.photography
  artifactName: Holst-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
nsis:
  oneClick: true
  perMachine: false
  artifactName: Holst-Setup-${version}.${ext}
  shortcutName: Холст
  uninstallDisplayName: Холст
publish:
  provider: github
  releaseType: release
