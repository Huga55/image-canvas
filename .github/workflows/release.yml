name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag release when it is not on GitHub yet
        id: gate
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${version}")
          code=$(printf '%s' "$response" | tail -n 1)
          body=$(printf '%s' "$response" | sed '$d')
          if [ "$code" = "200" ]; then
            missing=$(BODY="$body" VERSION="$version" node -e '
              const release = JSON.parse(process.env.BODY)
              const names = (release.assets || []).map((asset) => asset.name)
              const required = ["Holst-Setup-" + process.env.VERSION + ".exe", "latest.yml", "latest-mac.yml"]
              const absent = required.filter((name) => !names.includes(name))
              if (!names.some((name) => name.endsWith(".dmg"))) absent.push("dmg")
              process.stdout.write(String(absent.length))
            ')
            if [ "$missing" = "0" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Версия $version уже опубликована"
              exit 0
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "В релизе v${version} не хватает файлов, загружаем ещё раз"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            git tag "v${version}" "${GITHUB_SHA}"
            git push origin "refs/tags/v${version}"
          fi
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"v${version}\",\"target_commitish\":\"${GITHUB_SHA}\",\"name\":\"v${version}\",\"draft\":false,\"prerelease\":false}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win
          - os: macos-latest
            builder_args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and publish
        shell: bash
        run: npx electron-vite build && npx electron-builder ${{ matrix.builder_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EP_GH_IGNORE_TIME: true
